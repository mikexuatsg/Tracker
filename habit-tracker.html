  /* ==================== 彩纸动画 ==================== */
  var canvas = $('#confetti');
  var ctx = canvas.getContext('2d');
  var particles = [];
  var confettiRAF = null;
  var W = 0, H = 0, DPR = 1;

  function resizeCanvas() {
    DPR = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', function () { if (confettiRAF) resizeCanvas(); });

  function startConfetti() {
    resizeCanvas();
    var colors = ['#F2936B', '#FFC7A8', '#7FB69B', '#F7D794', '#E58FB1', '#8ECAE6'];
    particles = [];
    for (var i = 0; i < 170; i++) {
      particles.push({
        x: Math.random() * W,
        y: -Math.random() * H * 0.6 - 20,
        w: 6 + Math.random() * 6,
        h: 8 + Math.random() * 8,
        vx: -1.3 + Math.random() * 2.6,
        vy: 2 + Math.random() * 3.6,
        rot: Math.random() * Math.PI * 2,
        vr: -0.14 + Math.random() * 0.28,
        color: colors[i % colors.length]
      });
    }
    if (confettiRAF) cancelAnimationFrame(confettiRAF);
    var start = performance.now();

    function loop(now) {
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.vy += 0.035;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = 0.92;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      particles = particles.filter(function (p) { return p.y < H + 60; });
      if (particles.length && now - start < 7000) {
        confettiRAF = requestAnimationFrame(loop);
      } else {
        ctx.clearRect(0, 0, W, H);
        confettiRAF = null;
      }
    }
    confettiRAF = requestAnimationFrame(loop);
  }

  /* ==================== 打卡粒子爆破 ====================
     在某个坐标点喷射一圈粒子（点击按钮位置 / 卡片中央），约 1 秒内散开淡出。
     与上面的彩纸雨彼此独立、各自的画布与循环，互不干扰。 */
  var burstCanvas = $('#burst');
  var bctx = burstCanvas ? burstCanvas.getContext('2d') : null;
  var burstParticles = [];
  var burstRAF = null;
  var BW = 0, BH = 0, BDPR = 1;

  function resizeBurst() {
    if (!burstCanvas) return;
    BDPR = window.devicePixelRatio || 1;
    BW = window.innerWidth;
    BH = window.innerHeight;
    burstCanvas.width = Math.floor(BW * BDPR);
    burstCanvas.height = Math.floor(BH * BDPR);
    bctx.setTransform(BDPR, 0, 0, BDPR, 0, 0);
  }
  window.addEventListener('resize', function () { if (burstRAF) resizeBurst(); });

  function fireBurst(x, y) {
    if (!bctx) return;
    resizeBurst();
    var colors = ['#F2936B', '#FFC7A8', '#7FB69B', '#F7D794', '#E58FB1', '#8ECAE6', '#EFAE45'];
    var n = 66;
    for (var i = 0; i < n; i++) {
      var ang = (Math.PI * 2 * i / n) + Math.random() * 0.32;   // 放射状均分 + 轻微抖动
      var spd = 3.2 + Math.random() * 5.6;
      burstParticles.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        g: 0.16 + Math.random() * 0.12,
        size: 3 + Math.random() * 5,
        rot: Math.random() * Math.PI,
        vr: -0.3 + Math.random() * 0.6,
        life: 1,
        color: colors[i % colors.length]
      });
    }
    if (burstRAF) return;   // 已有循环在跑，新粒子由同一循环带动
    function loop() {
      bctx.clearRect(0, 0, BW, BH);
      for (var i = 0; i < burstParticles.length; i++) {
        var p = burstParticles[i];
        p.vy += p.g;
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.life -= 0.018;
        bctx.save();
        bctx.globalAlpha = Math.max(0, p.life);
        bctx.translate(p.x, p.y);
        bctx.rotate(p.rot);
        bctx.fillStyle = p.color;
        bctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.62);
        bctx.restore();
      }
      burstParticles = burstParticles.filter(function (p) { return p.life > 0 && p.y < BH + 80; });
      if (burstParticles.length) {
        burstRAF = requestAnimationFrame(loop);
      } else {
        bctx.clearRect(0, 0, BW, BH);
        burstRAF = null;
      }
    }
    burstRAF = requestAnimationFrame(loop);
  }

  /* ==================== 音效（Web Audio 合成 + HTML5 Audio · 预留接口） ====================
     · 默认用 Web Audio 合成一段清脆的成就铃声，无需任何音频文件即可出声。
     · 若把 checkout.mp3 / level-up.mp3 放到本 HTML 同级目录，则自动改用真实音效。
     · 浏览器要求「用户手势」后才能出声：打卡本身就是点击，故可直接播放。
     调试：控制台执行 habitSound.play('levelup') 试听 / habitSound.enable(false) 静音。 */
  var SOUND_ON = true;
  var SOUND_SRC = { checkin: 'checkout.mp3', levelup: 'level-up.mp3' };
  var soundEls = {};          // 文件存在时的 <audio> 元素
  var fileState = {};         // name -> 'ready' | 'missing'
  var audioCtx = null;

  function ensureCtx() {
    if (audioCtx) return audioCtx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { audioCtx = new AC(); } catch (e) { audioCtx = null; }
    return audioCtx;
  }
  // 首次交互时解锁音频上下文（移动端 / 新版桌面浏览器的自动播放策略）
  function unlockAudio() {
    var c = ensureCtx();
    if (c && c.state === 'suspended') { try { c.resume(); } catch (e) { /* 忽略 */ } }
  }
  document.addEventListener('pointerdown', unlockAudio);
  document.addEventListener('keydown', unlockAudio);

  // 无外部音频文件时的合成铃声：checkin 两连音 / levelup 上行琶音
  function synthSound(name) {
    var ctx = ensureCtx();
    if (!ctx) return;
    if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) { /* 忽略 */ } }
    var seq = (name === 'levelup')
      ? [[523.25, 0], [659.25, 0.09], [783.99, 0.18], [1046.50, 0.30]]   // C5 E5 G5 C6
      : [[987.77, 0], [1318.51, 0.085]];                                 // B5 → E6 清脆两音
    var dur = (name === 'levelup') ? 0.36 : 0.24;
    var t0 = ctx.currentTime + 0.01;
    seq.forEach(function (p) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      var t = t0 + p[1];
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(p[0], t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.22, t + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.03);
    });
  }

  function playSound(name) {
    if (!SOUND_ON) return;
    name = name || 'checkin';

    // 已知文件不存在 → 直接合成
    if (fileState[name] === 'missing') { synthSound(name); return; }

    // 若提供了 checkout.mp3 / level-up.mp3，则优先播放文件
    if (SOUND_SRC[name] && typeof Audio !== 'undefined') {
      try {
        var a = soundEls[name];
        if (!a) {
          a = new Audio(SOUND_SRC[name]);
          a.preload = 'auto';
          a.volume = 0.7;
          a.addEventListener('canplaythrough', function () { fileState[name] = 'ready'; });
          a.addEventListener('error', function () { fileState[name] = 'missing'; });
          soundEls[name] = a;
        }
        a.currentTime = 0;
        var pr = a.play();
        // 文件缺失 / 被拦截时，退回合成铃声，保证一定「听得到」
        if (pr && pr['catch']) pr['catch'](function () { fileState[name] = 'missing'; synthSound(name); });
        return;
      } catch (e) { fileState[name] = 'missing'; }
    }
    synthSound(name);
  }

  window.habitSound = {
    play: playSound,
    enable: function (on) { SOUND_ON = !!on; },
    sources: SOUND_SRC
  };

  /* ==================== 打卡瞬时反馈：爆破 + 弹跳 + 音效 ==================== */
  function cardElById(id) {
    return $('#list') ? $('#list').querySelector('.card[data-id="' + id + '"]') : null;
  }

  // 卡片轻微弹跳（优先 Web Animations，失败退回 CSS 类）
  function pulseCard(card) {
    if (!card) return;
    if (card.animate) {
      card.animate([
        { transform: 'scale(1)' },
        { transform: 'scale(1.035)' },
        { transform: 'scale(.992)' },
        { transform: 'scale(1)' }
      ], { duration: 600, easing: 'cubic-bezier(.2,.9,.3,1.2)' });
    } else {
      card.classList.add('pulse');
      setTimeout(function () { card.classList.remove('pulse'); }, 620);
    }
  }

  // 打卡成功瞬间：在点按位置（或卡片中央）喷射粒子 + 卡片弹跳 + 播放成就音效
  function checkinFeedback(t, ev, sound) {
    var card = cardElById(t.id);
    var x, y;
    if (ev && typeof ev.clientX === 'number' && (ev.clientX || ev.clientY)) {
      x = ev.clientX; y = ev.clientY;                 // 点按按钮位置
    } else if (card) {
      var r = card.getBoundingClientRect();           // 卡片中央
      x = r.left + r.width / 2;
      y = r.top + Math.min(r.height / 2, 130);
    } else {                                          // 屏幕中央
      x = window.innerWidth / 2;
      y = window.innerHeight / 2;
    }
    fireBurst(x, y);
    playSound(sound || 'checkin');
    pulseCard(card);
  }

  /* ==================== 轮次记录（同一习惯的多次进行） ==================== */
  var ROUND_LABEL = { active: '进行中', upcoming: '未开始', done: '已完成 🎉', expired: '未完成' };
  // 某一轮的打卡日历（只读展示，用在轮次记录弹层里）
  function roundChipsHTML(t) {
    var today = todayStr();
    if (isPeriodic(t)) {
      var unit = unitWord(t);
      return calendarRows(t).map(function (r) {
        var d = r.date;
        if (r.skipped) {
          return '<span class="day skip"><span class="n">跳过</span>' +
            '<span class="w">' + cnShort(d) + '</span></span>';
        }
        var rec = t.checkins[d];
        var cls = 'day' + (rec ? ' on' : '') + (d === today ? ' today' : '') + (d > today ? ' future' : '');
        return '<span class="' + cls + '"><span class="n">第' + (r.slotIndex + 1) + unit + '</span>' +
          '<span class="w">' + (rec ? '✓' : cnShort(d)) + '</span></span>';
      }).join('');
    }
    return calendarRows(t).map(function (r) {
      var d = r.date;
      if (r.skipped) {
        return '<span class="day skip"><span class="n">跳过</span>' +
          '<span class="w">' + cnShort(d) + '</span></span>';
      }
      var rec = t.checkins[d];
      var perfect = !!(rec && !isPeriodic(t) && isPerfectDay(d));   // 大满贯之日：金黄底
      var cls = 'day' + (rec ? ' on' : '') + (perfect ? ' perfect' : '') +
        (d === today ? ' today' : '') + (d > today ? ' future' : '');
      return '<span class="' + cls + '"><span class="n">' + cnShort(d) + '</span>' +
        '<span class="w">' + (rec ? '✓' : cnWeek(d)) + '</span></span>';
    }).join('');
  }
  function roundNotesHTML(t) {
    return periodsOf(t).filter(function (d) {
      return t.checkins[d] && t.checkins[d].note;
    }).reverse().map(function (d) {
      var rec = t.checkins[d];
      return '<div class="note-item"><span class="d">' + cnShort(d) + ' ' + cnTime(rec.time) + '</span>' +
        '<span>' + esc(rec.note) + '</span></div>';
    }).join('');
  }
  function openRounds(t) {
    var rounds = seriesTasks(t);            // 第 1 轮在前
    var doneRounds = rounds.filter(isComplete).length;
    var totalCheck = rounds.reduce(function (s, r) { return s + checkedCount(r); }, 0);
    var blocks = rounds.slice().reverse().map(function (r) {   // 最近的轮次排在最上面
      var st = statusOf(r);
      var done = checkedCount(r);
      var earned = earnedOf(r);
      return '<div class="round-block">' +
        '<div class="round-head"><b>第 ' + (r.roundNo || 1) + ' 轮</b>' +
          '<span class="badge ' + BADGE[st][1] + '">' + ROUND_LABEL[st] + '</span></div>' +
        '<div class="round-meta">' + cnDate(r.startDate) + ' 开始 · ' +
          (r.longTerm ? '长期循环 ♾️' : '共 ' + r.duration + ' ' + unitWord(r)) +
          (isWeekly(r) ? ' · 每' + WEEK[r.weekday] : '') +
          (isMonthly(r) ? ' · 每月 ' + r.monthDay + ' 号' : '') +
          ' · 已打卡 ' + done + (r.longTerm ? ' 次' : '/' + r.duration) +
          (earned > 0 ? ' · 奖励 ' + money(earned) : '') + '</div>' +
        '<div class="days round-days">' + roundChipsHTML(r) + '</div>' +
        (roundNotesHTML(r) ? '<div class="notes">' + roundNotesHTML(r) + '</div>' : '') +
        '</div>';
    }).join('');
    var head = '<div class="money-box"><span class="lbl">共进行 ' + rounds.length + ' 轮 · 已完成 ' +
      doneRounds + ' 轮</span><span class="amt">' + totalCheck + ' 次打卡</span></div>';
    showDetailModal('轮次记录 🔁', esc(t.name) + ' · 当前是第 ' + (t.roundNo || 1) + ' 轮',
      head + '<div class="round-list">' + blocks + '</div>');
  }

  /* ==================== 事件绑定 ==================== */
  $('#list').addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var t = findTask(el.dataset.id);
    if (!t) return;
    var action = el.dataset.action;

    if (action === 'checkin' || action === 'day') {
      juicyPress(el);                              // 按压缩放：更爽的即时反馈
      if (isComposite(t)) openChecklist(t, el.dataset.date);
      else openCheckin(t, el.dataset.date);
    } else if (action === 'item') {
      juicyPress(el);
      toggleItem(t, el.dataset.date, el.dataset.item, e);
    } else if (action === 'items') {
      openEditItems(t);
    } else if (action === 'skip') {
      openSkipManager(t);
    } else if (action === 'skipnote') {
      openSkipNote(t, el.dataset.date, false);
    } else if (action === 'duration') {
      openAdjustDuration(t);
    } else if (action === 'toggle') {
      expanded[t.id] = !expanded[t.id];
      render();
    } else if (action === 'reward') {
      openReward(t, false);
    } else if (action === 'stars') {
      openEditStars(t);
    } else if (action === 'again') {
      openNewTask(t);
    } else if (action === 'rounds') {
      openRounds(t);
    } else if (action === 'del') {
      confirmDelete(t);
    } else if (action === 'more') {
      openMoreMenu(t);
    }
  });

  /* ==================== 双击标题：内联改名（最多 3 次） ==================== */
  $('#list').addEventListener('dblclick', function (e) {
    var title = e.target.closest('.card-title');
    if (!title || title.dataset.editing === '1') return;
    var t = findTask(title.dataset.id);
    if (t) startRename(t, title);
  });

  function startRename(t, title) {
    var left = RENAME_MAX - t.renameCount;
    if (left <= 0) { toast('修改次数已达上限（0/' + RENAME_MAX + '）'); return; }
    title.dataset.editing = '1';

    var orig = t.name;
    var box = document.createElement('div');
    box.className = 'rename-box';
    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'rename-input';
    input.maxLength = 30;
    input.value = orig;
    var hint = document.createElement('div');
    hint.className = 'rename-hint';
    hint.textContent = '还可修改 ' + left + ' 次';
    box.appendChild(input);
    box.appendChild(hint);
    title.textContent = '';
    title.appendChild(box);
    input.focus();
    input.select();

    var done = false;
    function finish(apply) {
      if (done) return;
      done = true;
      var val = input.value.trim();
      if (apply) {
        if (!val) {
          toast('名称不能为空');
        } else if (val !== orig) {
          t.name = val;
          t.renameCount += 1;
          save();
          toast('名称已更新，还可修改 ' + (RENAME_MAX - t.renameCount) + ' 次');
        }
      }
      render();
    }
    input.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); finish(true); }
      else if (ev.key === 'Escape') { ev.preventDefault(); finish(false); }
    });
    input.addEventListener('blur', function () { finish(true); });
    input.addEventListener('dblclick', function (ev) { ev.stopPropagation(); });
  }

  /* ==================== 卡片拖拽排序 ==================== */
  var drag = null;

  function commitOrder() {
    var cards = $('#list').querySelectorAll('.card');
    var ids = Array.prototype.map.call(cards, function (c) { return c.dataset.id; });
    if (ids.length < 2) return;
    var visible = {};
    ids.forEach(function (id) { visible[id] = true; });
    var picked = ids.map(findTask);
    var it = 0;
    // 只重排当前可见任务，未显示的任务保持原有相对位置
    var reordered = state.tasks.slice().sort(byOrder).map(function (t) {
      return visible[t.id] ? picked[it++] : t;
    });
    reordered.forEach(function (t, i) { t.order = i; });
    state.tasks = reordered;
    save();
  }

  function onDragMove(e) {
    if (!drag) return;
    if (!drag.active) {
      if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) < 6) return;
      drag.active = true;
      drag.card.classList.add('dragging');
    }
    e.preventDefault();
    drag.card.style.pointerEvents = 'none';
    var under = document.elementFromPoint(e.clientX, e.clientY);
    var target = (under && under.closest) ? under.closest('.card') : null;
    if (target && target !== drag.card && target.parentNode === drag.card.parentNode) {
      var r = target.getBoundingClientRect();
      var cx = r.left + r.width / 2;
      var cy = r.top + r.height / 2;
      var before;
      if (Math.abs(e.clientY - cy) > r.height * 0.35) before = e.clientY < cy; // 跨行：按上下
      else before = e.clientX < cx;                                            // 同行：按左右
      target.parentNode.insertBefore(drag.card, before ? target : target.nextSibling);
    }
  }

  function onDragEnd() {
    if (!drag) return;
    var moved = drag.active;
    drag.card.classList.remove('dragging');
    drag.card.style.pointerEvents = '';
    drag = null;
    if (moved) { commitOrder(); toast('顺序已保存'); }
  }

  $('#list').addEventListener('pointerdown', function (e) {
    var handle = e.target.closest('.drag-handle');
    if (!handle || (e.button !== undefined && e.button !== 0)) return;
    var card = handle.closest('.card');
    if (!card) return;
    e.preventDefault();
    drag = { card: card, sx: e.clientX, sy: e.clientY, active: false };
    if (handle.setPointerCapture) { try { handle.setPointerCapture(e.pointerId); } catch (err) {} }
  });
  document.addEventListener('pointermove', onDragMove, { passive: false });
  document.addEventListener('pointerup', onDragEnd);
  document.addEventListener('pointercancel', onDragEnd);

  /* ==================== 组合清单：子项拖拽排序 ==================== */
  var itemDrag = null;

  // 依照拖动后的新顺序重排数组（按 id 匹配）
  function reorderById(arr, ids) {
    var rank = {};
    ids.forEach(function (id, i) { rank[id] = i; });
    arr.sort(function (a, b) {
      var ra = rank.hasOwnProperty(a.id) ? rank[a.id] : 9999;
      var rb = rank.hasOwnProperty(b.id) ? rank[b.id] : 9999;
      return ra - rb;
    });
  }

  function startItemDrag(box, row, onDrop, e) {
    if (!box || !row || (e.button !== undefined && e.button !== 0)) return;
    e.preventDefault();
    itemDrag = { box: box, row: row, onDrop: onDrop, sx: e.clientX, sy: e.clientY, active: false };
    var handle = row.querySelector('.cli-drag');
    if (handle && handle.setPointerCapture) {
      try { handle.setPointerCapture(e.pointerId); } catch (err) {}
    }
  }

  function onItemDragMove(e) {
    if (!itemDrag) return;
    if (!itemDrag.active) {
      if (Math.abs(e.clientX - itemDrag.sx) + Math.abs(e.clientY - itemDrag.sy) < 6) return;
      itemDrag.active = true;
      itemDrag.row.classList.add('item-dragging');
    }
    e.preventDefault();
    itemDrag.row.style.pointerEvents = 'none';
    var under = document.elementFromPoint(e.clientX, e.clientY);
    var target = (under && under.closest) ? under.closest('[data-row]') : null;
    if (target && target !== itemDrag.row && target.parentNode === itemDrag.row.parentNode) {
      var r = target.getBoundingClientRect();
      var cy = r.top + r.height / 2;
      target.parentNode.insertBefore(itemDrag.row, e.clientY < cy ? target : target.nextSibling);
    }
  }

  function onItemDragEnd() {
    if (!itemDrag) return;
    var d = itemDrag;
    var moved = d.active;
    d.row.classList.remove('item-dragging');
    d.row.style.pointerEvents = '';
    itemDrag = null;
    if (!moved) return;
    var ids = Array.prototype.map.call(d.box.querySelectorAll('[data-row]'), function (n) {
      return n.dataset.row;
    });
    if (typeof d.onDrop === 'function') d.onDrop(ids);
  }

  document.addEventListener('pointermove', onItemDragMove, { passive: false });
  document.addEventListener('pointerup', onItemDragEnd);
  document.addEventListener('pointercancel', onItemDragEnd);

  // 打卡清单（卡片内 / 弹层）拖拽结束后：写回任务并持久化
  function checklistDrop(t) {
    return function (ids) {
      reorderById(t.items, ids);
      save();
      toast('清单顺序已保存');
      render();
    };
  }

  // 卡片内清单：委托监听（卡片会整体重绘，需绑定在常驻的 #list 上）
  $('#list').addEventListener('pointerdown', function (e) {
    var handle = e.target.closest('.cli-drag');
    if (!handle) return;
    var row = handle.closest('[data-row]');
    if (!row) return;
    var card = handle.closest('.card');
    var box = row.parentNode;
    var t = card ? findTask(card.dataset.id) : null;
    if (!t || !box) return;
    startItemDrag(box, row, checklistDrop(t), e);
  });

  $('#tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]');
    if (!b) return;
    uiTab = b.dataset.tab;
    render();
  });

  /* 汇总卡片：单击查看明细 */
  $('#rewardSum').addEventListener('click', function (e) {
    var b = e.target.closest('[data-sum]');
    if (!b) return;
    if (b.dataset.sum === 'reward') openRewardDetail();
    else if (b.dataset.sum === 'done') openDoneDetail();
  });

  $('#addBtn').addEventListener('click', function () { openNewTask(null); });

  /* ==================== 备份：导出 / 导入 ==================== */
  $('#exportBtn').addEventListener('click', function () {
    var data = JSON.stringify({
      version: 1,
      exportedAt: new Date().toISOString(),
      tasks: state.tasks,
      chests: state.chests
    }, null, 2);
    var blob = new Blob([data], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '习惯打卡备份-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    toast('已导出备份文件');
  });

  $('#importBtn').addEventListener('click', function () { $('#importFile').click(); });

  $('#importFile').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var d = JSON.parse(reader.result);
        if (!d || !Array.isArray(d.tasks)) throw new Error('bad format');
        adoptTasks(d.tasks);
        if (d.chests) state.chests = normalizeChests(d.chests);
        save();
        render();
        toast('导入成功，共 ' + state.tasks.length + ' 个任务');
      } catch (err) {
        toast('导入失败：文件格式不正确');
      }
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  /* ==================== 启动 ==================== */
  load();
  render();
})();
</script>
</body>
</html>
