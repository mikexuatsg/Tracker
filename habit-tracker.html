<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F2">
<meta name="color-scheme" content="light">
<title>慢慢来 · 习惯打卡</title>
<style>
/* ---------- 基础 ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  /* ── Warm Apple palette ──
     The app keeps its own warm tint; the hairlines, radii, materials and motion become
     the system's, so the surfaces read as Apple's rather than as a flat web page. */
  --bg:#FBF7F2; --card:#FFFFFF; --ink:#3A322B; --soft:#8B8078;
  --accent:#F2936B; --accent-d:#DE7A50; --accent-soft:#FFEDE2;
  --mint:#4FAE86; --mint-soft:#E7F3ED; --line:rgba(150,120,95,.18);
  --danger:#D98080; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(150,110,80,.10);
  /* Materials + motion, shared with the rest of the suite. */
  --material:rgba(255,255,255,.75); --material-thick:rgba(255,255,255,.9);
  --blur:saturate(180%) blur(20px);
  --radius:14px; --radius-lg:20px; --radius-pill:999px;
  /* The spec's shadow is one wide 4%-opacity diffusion; the warm whisper keeps it sitting
     in this page's warm frame rather than on a neutral one. */
  --shadow:0 4px 24px rgba(0,0,0,.04),0 1px 2px rgba(150,110,80,.06);
  --shadow-md:0 6px 32px rgba(0,0,0,.07),0 1px 2px rgba(150,110,80,.06);
  --shadow-lg:0 16px 56px rgba(40,25,15,.14);
  --ring:0 0 0 4px rgba(242,147,107,.28);
  --ease-apple:cubic-bezier(.25,.1,.25,1);
  --ease-spring:cubic-bezier(.34,1.4,.64,1);
}
html,body{margin:0;padding:0;-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility; padding-bottom:100px;
}
::selection{background:rgba(242,147,107,.28);color:var(--ink)}
.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 8px}
h2,h3,h4{margin:0}

/* ---------- 头部 ---------- */
.app-head{padding:4px 2px 14px}
.app-head h1{font-size:22px;font-weight:700;letter-spacing:.4px;margin-bottom:6px}
.app-head p{margin:0;font-size:13px;color:var(--soft)}

/* ---------- 标签栏 ---------- */
.tabs{display:flex;gap:8px;margin:0 0 16px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;font-family:inherit;font-size:14px;color:var(--soft);background:#fff;
  border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;transition:all .2s}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(242,147,107,.3)}

/* ---------- 卡片列表（按频率分栏 → 每组内部响应式多列网格） ---------- */
#list{display:block}
.grid{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.group{animation:rise .32s ease}
.group+.group{margin-top:26px}
.group-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink);
  margin:0 0 13px;padding:0 2px 11px;border-bottom:1px solid var(--line)}
.group-head .g-ico{font-size:15px;line-height:1}
.group-head .g-n{margin-left:auto;font-size:11.5px;font-weight:500;color:var(--soft);
  background:#F4EEE8;border-radius:999px;padding:3px 10px}
.card{background:var(--card);border:1px solid #FBF3EC;border-radius:20px;padding:16px;
  box-shadow:var(--shadow);animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card-top>div{flex:1;min-width:0}
.card-title{font-size:17px;font-weight:600;word-break:break-word;cursor:text}
.card-title:hover{color:var(--accent-d)}
.drag-handle{flex:0 0 auto;width:24px;padding:2px 0;margin-top:1px;background:none;border:none;
  color:#CDBCAB;font-size:17px;line-height:1;cursor:grab;touch-action:none;border-radius:8px;
  display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.drag-handle:hover{color:var(--accent);background:#FBF3EC}
.drag-handle:active{cursor:grabbing}
.card.dragging{opacity:.55;box-shadow:0 14px 30px rgba(196,160,128,.28)}
/* ---------- 双击改名 ---------- */
.rename-box{margin:0}
.rename-input{width:100%;font-family:inherit;font-size:17px;font-weight:600;color:var(--ink);
  background:#FBF7F3;border:1px solid var(--accent);border-radius:12px;padding:8px 10px;outline:none}
.rename-hint{font-size:11.5px;color:var(--soft);margin-top:6px}
.card-meta{font-size:12px;color:var(--soft);margin-top:5px}
.badge{flex:0 0 auto;font-size:11px;padding:5px 10px;border-radius:999px;white-space:nowrap}
.b-active{background:var(--mint-soft);color:#4E8A6C}
.b-done{background:var(--accent-soft);color:#C4652F}
.b-up{background:#F2F0EA;color:#8A8175}
.b-exp{background:#F7EDE9;color:#A97F72}
.b-round{background:#EFE9FB;color:#7A5CC0}
.card-top>.card-side{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:7px}

/* ---------- 难度星级 & 奖励 ---------- */
.stars{display:flex;align-items:center;gap:2px;font-family:inherit;font-size:13px;line-height:1;
  color:#EFAE45;background:#FFF8EC;border:1px solid #F6E6C9;border-radius:999px;padding:4px 9px;
  cursor:pointer;white-space:nowrap;transition:border-color .16s}
.stars:hover{border-color:#EBCF9E}
.stars .off{color:#E4D8C8}
.reward-sum{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}
.sum-item{flex:1 1 0;min-width:140px;display:flex;align-items:center;gap:11px;background:#fff;
  border:1px solid #FBF3EC;border-radius:16px;padding:11px 15px;box-shadow:var(--shadow);
  font-family:inherit;text-align:left;color:inherit;cursor:pointer;
  transition:border-color .16s,box-shadow .16s,transform .12s}
.sum-item:hover{border-color:#F3D9C7;box-shadow:0 8px 22px rgba(196,160,128,.18)}
.sum-item:active{transform:scale(.985)}
.sum-arrow{margin-left:auto;font-size:20px;line-height:1;color:#CDBCAB}
.sum-item .s-ico{font-size:19px;line-height:1}
.sum-item .s-body{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.sum-item .s-body b{font-size:17px;color:var(--accent-d)}
.sum-item .s-body em{font-style:normal;font-size:11.5px;color:var(--soft)}
.money-box{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:linear-gradient(135deg,#FFF6E6,#FDEBF3);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.money-box .lbl{font-size:13px;color:#B98A6B}
.money-box .amt{font-size:20px;font-weight:700;color:#C4652F}
.starpick{display:flex;align-items:center;gap:4px}
.starbtn{background:none;border:none;font-family:inherit;font-size:31px;line-height:1;color:#E4D8C8;
  cursor:pointer;padding:2px 4px;transition:transform .12s,color .16s}
.starbtn.on{color:#EFAE45}
.starbtn:active{transform:scale(.88)}
.star-hint{font-size:12px;color:#B98A6B;margin-top:10px}

/* ---------- 进度 ---------- */
.progress{margin-top:15px}
.progress-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--soft);margin-bottom:8px}
.progress-head b{color:var(--accent-d);font-size:15px;font-weight:700}
.bar{height:10px;border-radius:999px;background:#F6EDE5;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#FFC7A8,#F2936B);
  transition:width .5s cubic-bezier(.2,.9,.3,1)}
.bar-fill.done{background:linear-gradient(90deg,#A9D8BF,#7FB69B)}
.bar-fill.long{background:linear-gradient(90deg,#F6C79A,#EEA86B,#F6C79A);background-size:200% 100%;
  animation:endlessBar 4s linear infinite}
@keyframes endlessBar{from{background-position:0 0}to{background-position:-200% 0}}

/* ---------- 今日操作区 ---------- */
.today{margin-top:15px}
.hint{background:#FBF7F2;color:#9A8B7D;font-size:13px;border-radius:14px;padding:12px 14px}
.checked-pill{display:flex;align-items:center;gap:8px;background:var(--mint-soft);color:#3F7A5D;
  border-radius:14px;padding:12px 14px;font-size:14px;font-weight:500}
.checked-pill .t{margin-left:auto;font-size:12px;opacity:.75;font-weight:400}
.note-preview{margin-top:9px;padding-left:10px;border-left:3px solid var(--line);
  font-size:13px;color:var(--soft);word-break:break-word}
.reward-box{background:linear-gradient(135deg,#FFF3E9,#FDEBF3);border-radius:16px;padding:15px;margin-bottom:10px}
.reward-label{font-size:12px;color:#B98A6B;margin-bottom:6px}
.reward-text{font-size:16px;font-weight:600;color:#8A5A3B;word-break:break-word}
.rest-tip{background:var(--mint-soft);color:#3F7A5D;border-radius:14px;padding:12px 14px;font-size:13.5px}

/* ---------- 按钮 ---------- */
.btn{font-family:inherit;font-size:15px;border:none;border-radius:14px;padding:12px 16px;cursor:pointer;
  transition:transform .12s ease,filter .2s ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 5px 14px rgba(242,147,107,.32)}
.btn.ghost{background:#F6F1EC;color:var(--ink)}
.btn.wide{width:100%;padding:14px}
.actions{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:12px;align-items:center}
.txt-btn{background:none;border:none;font-family:inherit;font-size:13px;color:var(--soft);
  padding:6px 0;cursor:pointer;text-decoration:underline dotted rgba(154,139,125,.6);text-underline-offset:3px}
.txt-btn.dg{color:var(--danger)}

/* ---------- 卡面底部操作区：查看记录（左）+ 更多「···」（右） ---------- */
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.rec-link{display:inline-flex;align-items:center;gap:5px;background:none;border:none;
  font-family:inherit;font-size:13px;color:var(--accent-d);cursor:pointer;padding:3px 2px;
  text-decoration:underline dotted rgba(222,122,80,.5);text-underline-offset:3px}
.rec-link .arr{font-size:13px;line-height:1;transition:transform .2s}
.rec-link.open .arr{transform:rotate(90deg)}
.more-btn{flex:0 0 auto;width:30px;height:30px;border-radius:10px;border:1px solid var(--line);
  background:#FBF7F3;color:var(--soft);font-family:inherit;font-size:16px;font-weight:700;line-height:1;
  letter-spacing:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s}
.more-btn:hover{color:var(--accent-d);border-color:#EBCF9E;background:#FFF6EF}

/* ---------- 每天记录 ---------- */
.history{margin-top:15px;border-top:1px dashed var(--line);padding-top:14px;animation:rise .25s ease}
.history h4{font-size:12.5px;font-weight:500;color:var(--soft);margin-bottom:11px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:7px}
.day{border:1px solid var(--line);background:#FAF5F0;border-radius:12px;padding:7px 2px;
  text-align:center;cursor:pointer;font-family:inherit;color:inherit;line-height:1.3;transition:transform .12s}
.day:active{transform:scale(.94)}
.day .n{display:block;font-size:12px;font-weight:600}
.day .w{display:block;font-size:10px;color:var(--soft);margin-top:1px}
.day.on{background:var(--mint);border-color:var(--mint)}
.day.on .n,.day.on .w{color:#fff}
.day.on .w{font-size:12px;font-weight:700}
.day.today{outline:2px solid var(--accent);outline-offset:1px}
.day.future{opacity:.42;cursor:not-allowed}
.notes{margin-top:14px}
.note-item{display:flex;gap:10px;font-size:13px;padding:8px 0;border-bottom:1px dashed #F4EDE6;word-break:break-word}
.note-item:last-child{border-bottom:none}
.note-item .d{flex:0 0 auto;color:var(--soft);font-size:11.5px;padding-top:2px;white-space:nowrap}
.note-item.skip-note .d{color:#B98A6B}

/* ---------- 跳过周 ---------- */
.day.skip{background:#F2F0EA;border-style:dashed;cursor:default}
.day.skip .n,.day.skip .w{color:#A99F92}
.day.skip .w{font-size:11px}
.history .day.skip{cursor:pointer}
.day.skip.hasnote{background:#FBF1E6;border-color:#E8D6C1}
.day.skip.hasnote .n::after{content:" 📝"}
.skip-list{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;margin-top:2px}
.skip-row{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#FBF7F3}
.skip-row.off{background:#F4F1EC;border-style:dashed}
.skip-info{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.skip-info b{font-size:14px;font-weight:600}
.skip-info span{font-size:12px;color:var(--soft)}
.skip-info em{font-style:normal;font-size:11.5px;color:#4E8A6C}
.skip-row.off .skip-info em{color:#A99F92}
.skip-row .dchip{padding:8px 12px;font-size:13px;flex:0 0 auto}
.skip-info .skip-why{font-size:11.5px;color:#B98A6B;margin-top:3px;word-break:break-word}
.skip-info .skip-why.empty{color:#C3B6A9}
.skip-btns{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.skip-btns .dchip{padding:7px 12px}
/* 高亮「今天」这一行：柔和的橙调描边 + 浅底，一眼可辨 */
.skip-row.today{border-color:var(--accent);background:var(--accent-soft);
  box-shadow:0 0 0 2px rgba(242,147,107,.16)}
.skip-row.today.off{background:#FDF3EC}
.skip-row.today .skip-info b{color:var(--accent-d)}
.skip-today-tag{display:inline-block;margin-left:7px;font-size:10.5px;font-weight:700;color:#fff;
  background:var(--accent);border-radius:999px;padding:1px 8px;vertical-align:middle;line-height:1.7}

/* ---------- 组合打卡（Routine / 清单） ---------- */
.checklist{display:flex;flex-direction:column;gap:7px}
.cli{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-family:inherit;
  font-size:14.5px;color:var(--ink);background:#FBF7F3;border:1px solid var(--line);
  border-radius:14px;padding:11px 13px;cursor:pointer;transition:background .16s,border-color .16s}
.cli:active{transform:scale(.985)}
.cli .box{flex:0 0 auto;width:20px;height:20px;border-radius:7px;border:1.6px solid #DCCDBE;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;line-height:1;
  transition:background .16s,border-color .16s}
.cli .t{min-width:0;word-break:break-word}
.cli.on{background:var(--mint-soft);border-color:#BFE3CE}
.cli.on .box{background:var(--mint);border-color:var(--mint)}
.cli.on .t{color:#3F7A5D}
.cli-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;
  color:var(--soft);margin-bottom:9px}
.cli-head b{color:var(--accent-d);font-size:15px;font-weight:700}
.item-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.item-row input{flex:1;min-width:0}
.item-del{flex:0 0 auto;width:40px;height:44px;border:1px solid var(--line);background:#FBF7F3;color:#B9A99A;
  border-radius:12px;font-family:inherit;font-size:14px;cursor:pointer;line-height:1}
.item-del:hover{color:var(--danger);border-color:#EED7CE}
.item-add{width:100%;font-family:inherit;font-size:13.5px;color:var(--accent-d);background:#FBF7F3;
  border:1px dashed var(--line);border-radius:12px;padding:11px;cursor:pointer;margin-top:2px}
.item-count{font-size:11.5px;color:var(--soft);margin-top:7px}
/* ---------- 组合清单：子项拖拽排序 ---------- */
.cli-wrap{display:flex;align-items:center;gap:6px}
.cli-wrap .cli{flex:1;min-width:0}
.cli-drag{flex:0 0 auto;width:28px;height:38px;background:none;border:none;font-family:inherit;
  color:#CDBCAB;font-size:15px;line-height:1;cursor:grab;touch-action:none;border-radius:8px;
  display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.cli-drag:hover{color:var(--accent);background:#FBF3EC}
.cli-drag:active{cursor:grabbing}
.item-row .cli-drag{height:44px}
.item-dragging{opacity:.55;box-shadow:0 12px 26px rgba(196,160,128,.25)}

/* ---------- 明细弹层（奖励 / 已完成任务） ---------- */
.detail-list{display:flex;flex-direction:column;gap:9px}
.detail-row{display:flex;align-items:flex-start;gap:12px;background:#FBF7F3;border:1px solid var(--line);
  border-radius:14px;padding:12px 13px}
.detail-main{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.detail-main b{font-size:14.5px;font-weight:600;word-break:break-word}
.detail-main em{font-style:normal;font-size:12px;color:var(--soft)}
.detail-gift{font-size:12.5px;color:#B98A6B;word-break:break-word}
.detail-amt{flex:0 0 auto;font-size:16px;font-weight:700;color:#C4652F;white-space:nowrap}

/* ---------- 轮次记录（同一习惯的多次进行） ---------- */
.round-list{display:flex;flex-direction:column;gap:12px}
.round-block{border:1px solid var(--line);border-radius:16px;padding:13px 13px 15px;background:#FBF7F3}
.round-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.round-head b{font-size:15px;font-weight:600}
.round-meta{font-size:12px;color:var(--soft);margin-bottom:10px;line-height:1.6}
.round-days .day{cursor:default}
.round-days .day:active{transform:none}

/* ---------- 空状态 / 页脚 ---------- */
.empty{grid-column:1/-1;text-align:center;padding:46px 20px;color:var(--soft);font-size:14px}
.empty .e{font-size:42px;display:block;margin-bottom:12px}
.footer{text-align:center;color:#C3B6A9;font-size:12px;padding:14px 0 4px}
.footer .link{background:none;border:none;font-family:inherit;font-size:12px;color:#B0A193;
  text-decoration:underline;cursor:pointer;padding:6px}

/* ---------- 弹层 ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;
  background:rgba(74,63,53,.42);animation:fade .2s ease}
.overlay.show{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:#fff;
  border-radius:22px 22px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom));
  animation:sheet .28s cubic-bezier(.2,.9,.3,1)}
@keyframes sheet{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
.modal h2{font-size:19px;font-weight:700}
.modal-sub{margin:5px 0 18px;font-size:13px;color:var(--soft);word-break:break-word}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--soft);margin-bottom:7px}
input[type=text],input[type=date],input[type=number],textarea{
  width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:#FBF7F3;
  border:1px solid var(--line);border-radius:14px;padding:12px 13px;outline:none;-webkit-appearance:none}
input:focus,textarea:focus{border-color:var(--accent);background:#fff}
textarea{min-height:92px;resize:vertical;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.dchip{font-family:inherit;font-size:14px;color:var(--soft);background:#FBF7F3;border:1px solid var(--line);
  border-radius:999px;padding:10px 15px;cursor:pointer;transition:all .18s}
.dchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.modal-actions .btn{flex:1}

/* ---------- 「更多」菜单（低频/管理功能收纳） ---------- */
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:inherit;
  font-size:14.5px;color:var(--ink);background:#FBF7F3;border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;cursor:pointer;transition:all .18s}
.menu-item:hover{background:#FFF6EF;border-color:#EBCF9E}
.menu-item:active{transform:scale(.99)}
.menu-item .m-ico{flex:0 0 auto;width:22px;text-align:center;font-size:16px;line-height:1}
.menu-item .m-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.menu-item .m-txt em{font-style:normal;font-size:11.5px;color:var(--soft);margin-top:2px}
.menu-item .m-arr{flex:0 0 auto;color:#CDBCAB;font-size:15px}
.menu-item.dg{color:var(--danger);background:#FDF5F5;border-color:#F0D9D9}
.menu-item.dg .m-arr{color:var(--danger)}

/* ---------- 庆祝 ---------- */
.celebrate{text-align:center}
.big-emoji{font-size:54px;line-height:1.1;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}65%{transform:scale(1.18)}100%{transform:scale(1)}}
.celebrate h2{margin-top:8px}
.celebrate .line{font-size:14px;color:var(--soft);margin:8px 0 16px;line-height:1.7}
.celebrate .reward-box{margin:0 0 12px}
#confetti{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}

/* ---------- 打卡瞬时反馈：粒子爆破 / 卡片弹跳 ---------- */
/* 爆破画布叠在弹层之上（overlay 为 50），保证在弹层淡出时粒子依然可见 */
#burst{position:fixed;inset:0;width:100%;height:100%;z-index:65;pointer-events:none}
/* 「已打卡」状态胶囊：出现时轻微上浮 + 淡入，让状态切换更顺滑 */
.checked-pill{animation:pillIn .4s cubic-bezier(.2,.9,.3,1)}
@keyframes pillIn{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
/* 卡片弹跳（老旧浏览器不支持 Web Animations 时的兜底） */
@keyframes cardPulse{0%{transform:scale(1)}32%{transform:scale(1.035)}66%{transform:scale(.992)}100%{transform:scale(1)}}
.card.pulse{animation:cardPulse .6s cubic-bezier(.2,.9,.3,1.2)}

/* ---------- 底部按钮 & 提示 ---------- */
.add-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));pointer-events:none;
  background:linear-gradient(180deg,rgba(255,249,244,0) 0%,var(--bg) 45%)}
.add-bar .btn{width:100%;max-width:528px;padding:15px;font-size:16px;border-radius:16px;pointer-events:auto}
.toast{position:fixed;left:50%;bottom:104px;z-index:70;max-width:78vw;text-align:center;
  background:rgba(74,63,53,.93);color:#fff;font-size:13.5px;padding:11px 18px;border-radius:999px;
  opacity:0;transform:translate(-50%,10px);transition:all .26s ease;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 桌面微调 ---------- */
@media (min-width:600px){
  .overlay{align-items:center;padding:22px}
  .modal{border-radius:22px;padding-bottom:24px}
}

/* ---------- 响应式多列网格：手机 1 列 / 平板 2 列 / 大屏最多 3 列 ---------- */
@media (min-width:700px){ .grid{grid-template-columns:repeat(2,1fr)} }
@media (min-width:1040px){ .grid{grid-template-columns:repeat(3,1fr)} }

/* ════════════════════════════════════════════════════════════════════
   APPLE HIG POLISH
   The chrome, controls and materials, drawn the way the system draws them — the warm
   tint stays, everything around it becomes the system's. Appended last, so where a
   rule here speaks it wins; it never touches a size a media query depends on.
   ════════════════════════════════════════════════════════════════════ */

/* ── Overlay scrollbars: thin, rounded, floating in a transparent gutter ── */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(120,95,70,.28);background-clip:content-box;border:3px solid transparent;border-radius:var(--radius-pill)}
::-webkit-scrollbar-thumb:hover{background:rgba(120,95,70,.45);background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}

/* ── Cards: one radius, one hairline, one shadow, one gentle hover ──
   Hover lifts a single pixel and leans on the shadow, the way the system says
   "this is a surface" without the card jumping off the page. */
.card{border-color:rgba(150,120,95,.12);border-radius:var(--radius-lg);box-shadow:var(--shadow);
  transition:box-shadow .28s var(--ease-apple),transform .28s var(--ease-apple),border-color .28s var(--ease-apple)}
.card:hover{transform:translateY(-1px);border-color:rgba(150,120,95,.2);
  box-shadow:0 2px 6px rgba(0,0,0,.05),0 12px 32px rgba(150,110,80,.14)}
.rename-input{background:rgba(150,120,95,.05);border-radius:var(--radius);box-shadow:var(--ring);
  transition:border-color .18s var(--ease-apple),box-shadow .18s var(--ease-apple)}
.drag-handle,.cli-drag{border-radius:9px;transition:background .18s var(--ease-apple),color .18s var(--ease-apple)}

/* ── Tabs: pills on a hairline, filled with the tint when selected ── */
.tab{border-color:var(--line);
  transition:background .22s var(--ease-apple),border-color .22s var(--ease-apple),color .22s var(--ease-apple),box-shadow .22s var(--ease-apple),transform .15s var(--ease-apple)}
.tab:active{transform:scale(.96)}
.tab.on{border-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.06),0 5px 16px rgba(242,147,107,.3)}

/* ── Buttons: capsules with a real press state ── */
.btn{border-radius:var(--radius-pill);font-weight:500;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent;
  transition:background .18s var(--ease-apple),filter .18s var(--ease-apple),box-shadow .18s var(--ease-apple),transform .15s var(--ease-apple)}
.btn.primary{box-shadow:0 1px 2px rgba(0,0,0,.06),0 6px 16px rgba(242,147,107,.32)}
.btn.primary:hover{background:var(--accent-d)}
.btn.primary:active{filter:saturate(1.05) brightness(.96)}
.btn.ghost{background:rgba(150,120,95,.08);color:var(--ink)}
.btn.ghost:hover{background:rgba(150,120,95,.14)}
.item-del{border-radius:var(--radius);background:rgba(150,120,95,.06);
  transition:color .18s var(--ease-apple),border-color .18s var(--ease-apple),background .18s var(--ease-apple)}
.item-add{border-radius:var(--radius);background:rgba(150,120,95,.05);
  transition:background .18s var(--ease-apple),border-color .18s var(--ease-apple)}

/* ── Fields: system text fields, with the soft tinted focus halo ── */
input[type=text],input[type=date],input[type=number],textarea{
  border-radius:var(--radius);background:rgba(150,120,95,.05);box-shadow:inset 0 1px 2px rgba(0,0,0,.03);
  transition:border-color .18s var(--ease-apple),box-shadow .18s var(--ease-apple),background .18s var(--ease-apple)}
input[type=text]:focus,input[type=date]:focus,input[type=number]:focus,textarea:focus{
  border-color:var(--accent);background:#fff;box-shadow:var(--ring)}

/* ── Chips and pill groups ── */
.dchip{border-radius:var(--radius-pill);
  transition:background .18s var(--ease-apple),border-color .18s var(--ease-apple),color .18s var(--ease-apple),transform .15s var(--ease-apple)}
.dchip:active{transform:scale(.96)}
.dchip.on{border-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 12px rgba(242,147,107,.28)}

/* ── List rows: hairline groupings on a translucent warm well ── */
.day{border-radius:var(--radius);background:rgba(150,120,95,.05);
  transition:background .18s var(--ease-apple),border-color .18s var(--ease-apple),transform .15s var(--ease-apple)}
.day:not(.future):hover{border-color:rgba(242,147,107,.5)}
.day.skip,.day.skip.hasnote{background:rgba(150,120,95,.09)}
.cli,.detail-row,.skip-row,.round-block{border-color:rgba(150,120,95,.12);background:rgba(150,120,95,.045)}
.cli{border-radius:var(--radius);transition:background .18s var(--ease-apple),border-color .18s var(--ease-apple)}
.cli:hover{background:rgba(150,120,95,.08)}
.skip-row,.detail-row{border-radius:var(--radius)}
.round-block,.sum-item,.money-box{border-radius:var(--radius-lg)}
.bar{background:rgba(150,120,95,.12)}
.bar-fill{transition:width .55s var(--ease-apple)}
.stars{border-radius:var(--radius-pill);transition:border-color .18s var(--ease-apple),background .18s var(--ease-apple)}
.badge{border-radius:var(--radius-pill)}
.footer,.footer .link{color:var(--soft)}

/* ── Sheets: a material panel over a blurred, dimmed page ── */
.overlay{background:rgba(40,33,27,.34);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}
.modal{background:var(--material-thick);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  animation:sheet .42s var(--ease-spring)}
.modal h2{letter-spacing:-.02em}
/* The bottom sheet gets iOS's grabber; a centred desktop dialog goes without one. */
@media (max-width:599px){
  .modal{box-shadow:0 -8px 40px rgba(60,40,25,.18)}
  .modal::before{content:"";position:sticky;top:0;z-index:5;display:block;width:36px;height:5px;
    margin:-10px auto 12px;border-radius:var(--radius-pill);background:rgba(120,100,80,.26)}
}
@media (min-width:600px){ .modal{box-shadow:0 24px 60px rgba(40,25,15,.24)} }

/* ── The bottom action bar: a vibrancy material, so content fades into it ──
   The stops mirror --bg (#FBF7F2); they are literal because a token cannot be
   faded to transparent through rgba(). */
.add-bar{background:linear-gradient(180deg,rgba(251,247,242,0) 0%,rgba(251,247,242,.88) 45%,#FBF7F2 100%);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.add-bar .btn{border-radius:var(--radius-pill);box-shadow:0 2px 6px rgba(0,0,0,.06),0 10px 26px rgba(242,147,107,.34)}
.toast{background:rgba(48,40,34,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  font-weight:500;box-shadow:0 10px 30px rgba(60,40,25,.24)}

/* ── Keyboard users still get a visible focus ring ── */
button:focus-visible{outline:2.5px solid rgba(242,147,107,.55);outline-offset:2px}

/* ── Motion is decoration: stop when the system asks for less ── */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ── SPEC LOCK: the leftover numbers ──
   The polish layer above already draws the system's chrome. This last pass only tunes what
   the base rules still hand-picked: every container takes a token radius instead of a
   hand-typed 12–16px, the card and sheet shadows become the spec's wide low-opacity
   diffusions, and a button presses on the 0.2s ease the brief asks for. Appended last, so
   where the two disagree this one wins. The warm tint, the reward tower and the capsule
   tab/chip/dchip pills are deliberately left exactly as they are. */
.card{border-radius:var(--radius-lg);box-shadow:var(--shadow)}
.card:hover{box-shadow:var(--shadow-md);border-color:rgba(150,120,95,.2)}
.money-box,.sum-item,.reward-box,.round-block{border-radius:var(--radius-lg)}
.hint,.rest-tip,.cli,.detail-row,.skip-row,.day,.item,.add-bar .btn{border-radius:var(--radius)}
.modal{box-shadow:var(--shadow-lg)}
.btn{transition:all .2s ease}
.btn:active{transform:scale(.98)}
.btn.primary{box-shadow:0 1px 2px rgba(0,0,0,.05),0 5px 16px rgba(242,147,107,.26)}

/* ══════════════════════════════════════════════════════════════
   游戏化（Gamification）层
   · 连胜 Combo：<3 天显示「打卡 X 天」；3 / 5 / 7 / 9 火焰逐级变旺，≥11 紫焰
   · 大满贯之日：当天所有「按天」任务都打上卡 → 金黄底色 + 小皇冠
   · 完美通关宝箱：今日进行中任务全部完成 → 顶部宝箱可开
   全部为纯叠加样式，不改动既有版式；prefers-reduced-motion 下会被上面的
   全局规则统一降级为「无动画」。 */

/* ---------- 连胜徽章（进度条右侧） ---------- */
.ph-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ph-count{font-style:normal;font-size:11px;color:#C3B6A9}
.combo{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;
  line-height:1;border-radius:999px;padding:4px 10px;white-space:nowrap;
  background:#F4EEE8;color:#9A8B7D;transition:background .2s var(--ease-apple),
  color .2s var(--ease-apple),box-shadow .2s var(--ease-apple)}
.combo .c-ico{font-size:13px;line-height:1}
.combo.lv1{background:#FFF0E2;color:#E07B39;box-shadow:inset 0 0 0 1px #FBDCC0}
.combo.lv2{background:#FFE6DE;color:#D9483B;box-shadow:inset 0 0 0 1px #F6C6BA;
  animation:comboFloat 1.7s ease-in-out infinite}
.combo.lv3{background:#FFE1DC;color:#CE3B33;box-shadow:inset 0 0 0 1px #F4C3BB;
  animation:comboFloat 1.7s ease-in-out infinite}
.combo.lv4{background:#FFD9E0;color:#C0284E;box-shadow:inset 0 0 0 1px #F3C0CC;
  animation:comboFloat 1.7s ease-in-out infinite}
.combo.lv5{background:linear-gradient(135deg,#EFE3FF,#F9EDFF);color:#7A4BC9;
  box-shadow:inset 0 0 0 1px #DFCBF7;animation:comboFloat 1.7s ease-in-out infinite}
@keyframes comboFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}

/* ---------- 大满贯之日：绿色 → 金黄 ---------- */
.day.perfect{position:relative}
.day.on.perfect{background:linear-gradient(135deg,#FFE9A8,#EFAE45);border-color:#E4A02F;
  box-shadow:0 3px 12px rgba(239,174,69,.42)}
.day.on.perfect .n,.day.on.perfect .w{color:#6E4400}
.day.perfect::after{content:"👑";position:absolute;top:-7px;right:-5px;font-size:11px;line-height:1;
  pointer-events:none;filter:drop-shadow(0 1px 1px rgba(160,110,20,.35))}

/* ---------- 今日完美通关宝箱（页头下方常驻条） ---------- */
.chest-bar{display:flex;align-items:center;gap:11px;width:100%;margin-top:15px;padding:11px 15px;
  border-radius:16px;border:1px solid #FBF3EC;background:#fff;box-shadow:var(--shadow);
  font-family:inherit;font-size:13px;text-align:left;color:inherit}
.chest-bar .cb-ico{flex:0 0 auto;font-size:22px;line-height:1}
.chest-bar .cb-body{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.chest-bar .cb-body b{font-size:13.5px;font-weight:600;color:var(--ink)}
.chest-bar .cb-body em{font-style:normal;font-size:11.5px;color:var(--soft);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chest-bar .cb-arrow{margin-left:auto;font-size:20px;line-height:1;color:#CDBCAB}
.chest-bar .cb-mini{display:block;height:5px;border-radius:999px;background:#F1E8DF;
  overflow:hidden;margin-top:3px}
.chest-bar .cb-mini i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,#FFD79A,#F2936B);transition:width .45s var(--ease-apple)}
.chest-bar.ready{border-color:#F3D9C7;cursor:pointer;
  background:linear-gradient(135deg,#FFF6E9,#FDEBF3);animation:chestBreathe 2s ease-in-out infinite}
.chest-bar.ready:hover{box-shadow:0 8px 22px rgba(196,160,128,.2)}
.chest-bar.ready .cb-body b{color:#C4652F}
.chest-bar.ready .cb-ico{animation:chestShake 1.6s ease-in-out infinite}
.chest-bar.done{background:linear-gradient(135deg,#FFF8E4,#FDF0D6);border-color:#F2DFAF}
@keyframes chestBreathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes chestShake{0%,70%,100%{transform:rotate(0)}
  74%{transform:rotate(-11deg)}78%{transform:rotate(9deg)}
  82%{transform:rotate(-7deg)}86%{transform:rotate(5deg)}90%{transform:rotate(-3deg)}}

/* ---------- 打卡按钮按压缩放（Juicy press） ---------- */
@keyframes pressPop{0%{transform:scale(1)}32%{transform:scale(.9)}
  66%{transform:scale(1.045)}100%{transform:scale(1)}}
.press-pop{animation:pressPop .36s cubic-bezier(.2,.9,.3,1.35)}

/* ---------- 开箱弹层 ---------- */
.chest-modal{text-align:center}
.chest-modal .big-emoji{font-size:52px;line-height:1;display:block;
  animation:chestPop .62s cubic-bezier(.2,.9,.3,1.4)}
@keyframes chestPop{0%{transform:scale(.4) rotate(-12deg);opacity:0}
  60%{transform:scale(1.14) rotate(5deg);opacity:1}100%{transform:scale(1)}}
.chest-modal .praise{margin:14px 0 6px;font-size:16.5px;font-weight:700;color:#C4652F;line-height:1.65}
.chest-modal .praise-sub{margin:0;font-size:12.5px;color:var(--soft);line-height:1.7}
.chest-tally{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 4px;
  background:linear-gradient(135deg,#FFF6E6,#FDEBF3);border-radius:16px;padding:13px 16px}
.chest-tally .lbl{font-size:12.5px;color:#B98A6B}
.chest-tally .amt{font-size:18px;font-weight:700;color:#C4652F}
</style>
